name: Build & deploy (React port + existing site, combined)

# Auto-deploys on every push to main, powering the live
# kelcamer.github.io/GutBacteria Pages deployment (Pages source was
# switched from "Deploy from a branch" to "GitHub Actions" once this was
# confirmed working end-to-end; see "Porting to native
# react/PORTING_PLAN.md" for that history). workflow_dispatch is kept
# alongside push so it can still be re-run by hand (Actions tab -> this
# workflow -> Run) without needing an empty commit - e.g. to pick up a
# Pages config change, or retry a run that failed for an unrelated
# infra reason. This used to be manual-only, on purpose, as a safety net
# against a bad push reaching the live site unreviewed - switched to
# auto-deploy by explicit request once that trade-off was weighed.
#
# Single checkout, on purpose: the React port used to live on a separate
# `native-react-app` branch (which needed its own checkout, by explicit
# ref, since it was cleaned to carry only React-relevant files) - that
# branch has since been merged back into `main` now that the port is
# complete and verified, so both apps live in the same tree again and one
# checkout covers both.

on:
  push:
    branches: [main, 'overnight-audit-*', 'preview/**']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Two checkouts, on purpose. Pages replaces the ENTIRE site with one
      # artifact, so deploying a branch naively would take the live main site
      # down and replace it with unreviewed work. Instead: main always builds
      # the site as normal, and a non-main branch is additionally published to
      # /branch-preview/ alongside it. The live site is untouched either way.
      #
      # This exists because the Actions "Run workflow" ref picker frequently
      # fails to load on mobile, leaving no way to preview a branch at all.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: mainsite

      - uses: actions/checkout@v4
        with:
          path: branchsite

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "mainsite/Porting to native react/app/package-lock.json"

      - name: Build main site's React port
        working-directory: "mainsite/Porting to native react/app"
        run: npm ci && npm run build

      - name: Build branch preview (skipped when this IS main)
        if: github.ref_name != 'main'
        working-directory: "branchsite/Porting to native react/app"
        run: npm ci && npm run build

      - name: Assemble combined Pages artifact
        run: |
          set -e
          mkdir -p _site
          # Existing site, unchanged - every tracked file at repo root,
          # minus the things that don't belong in a deploy (this workflow,
          # the porting project's own source, git/editor cruft).
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.githooks' \
            --exclude='.venv-readable' \
            --exclude='Porting to native react' \
            --exclude='_site' \
            mainsite/ _site/
          # New React port, at its own subpath, alongside the old app.
          mkdir -p "_site/react-preview"
          cp -r "mainsite/Porting to native react/app/dist/." "_site/react-preview/"
          # Branch preview, if this run came from a branch. Lives at its own
          # path so the live site above is never replaced by unreviewed work.
          if [ "${{ github.ref_name }}" != "main" ]; then
            mkdir -p "_site/branch-preview"
            cp -r "branchsite/Porting to native react/app/dist/." "_site/branch-preview/"
            echo "branch preview published from ${{ github.ref_name }}"
          fi
          # There's no index.html at the repo root - the classic "Deploy
          # from a branch" source used to paper over that with Jekyll
          # auto-rendering README.md into a landing page, but
          # Actions-sourced Pages does NOT run Jekyll, so without this the
          # root would 404. Minimal honest placeholder, not a silent
          # decision about what the real root should eventually be - that's
          # still a separate call to make.
          # (printf, not a heredoc: a heredoc's closing delimiter has to be
          # completely unindented, which doesn't survive living inside an
          # indented YAML block scalar - learned that the hard way while
          # writing this line, not shipped as a live guess.)
          if [ ! -f _site/index.html ]; then
            printf '%s\n' \
              '<!doctype html><html><head><meta charset="utf-8"><title>GutBacteria</title></head>' \
              '<body style="font:16px/1.5 ui-sans-serif,system-ui;background:#160E2B;color:#F1EAFF;padding:2rem;max-width:40rem;margin:0 auto">' \
              '<h1>GutBacteria</h1>' \
              '<ul>' \
              '<li><a href="./gut-flora-atlas.html" style="color:#8FD3F4">Gut Flora Atlas (current app)</a></li>' \
              '<li><a href="./react-preview/" style="color:#8FD3F4">React port preview (in progress)</a></li>' \
              '</ul>' \
              '</body></html>' \
              > _site/index.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
