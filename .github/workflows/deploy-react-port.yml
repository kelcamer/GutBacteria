name: Build & deploy (React port + existing site, combined)

# Manual trigger only (workflow_dispatch) - this is the workflow currently
# powering the live kelcamer.github.io/GutBacteria Pages deployment (Pages
# source was switched from "Deploy from a branch" to "GitHub Actions" once
# this was confirmed working end-to-end; see "Porting to native
# react/PORTING_PLAN.md" for that history). Re-run it manually (Actions tab
# -> this workflow -> Run) whenever the live site should pick up new
# commits from either branch - there's no push trigger, so nothing deploys
# automatically as a side effect of a routine commit.
#
# Two checkouts, on purpose: the React port lives on `native-react-app`
# and was cleaned to contain ONLY React-relevant files (no duplicated copy
# of the existing single-file app) - so "the existing site" half of the
# combined artifact is sourced by checking out `main` separately, not by
# assuming it's sitting in the same working tree as the React app. This
# also means the workflow doesn't care which branch you dispatch it from;
# it always pulls main for the old app and native-react-app for the new
# one, by explicit ref.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing site (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout React port (native-react-app)
        uses: actions/checkout@v4
        with:
          ref: native-react-app
          path: react

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "react/Porting to native react/app/package-lock.json"

      - name: Install React port dependencies
        working-directory: "react/Porting to native react/app"
        run: npm ci

      - name: Build React port
        working-directory: "react/Porting to native react/app"
        run: npm run build

      - name: Assemble combined Pages artifact
        run: |
          set -e
          mkdir -p _site
          # Existing site, unchanged - every tracked file at main's repo
          # root, minus dev tooling that was never meant to be served
          # (same exclude list the pre-cleanup single-checkout version of
          # this workflow used, kept as-is since main itself wasn't
          # touched by the native-react-app branch cleanup).
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.githooks' \
            --exclude='.venv-readable' \
            ./site/ _site/
          # New React port, at its own subpath, alongside the old app.
          mkdir -p "_site/react-preview"
          cp -r "react/Porting to native react/app/dist/." "_site/react-preview/"
          # There's no index.html at main's repo root - the classic
          # "Deploy from a branch" source used to paper over that with
          # Jekyll auto-rendering README.md into a landing page, but
          # Actions-sourced Pages does NOT run Jekyll, so without this the
          # root would 404. Minimal honest placeholder, not a silent
          # decision about what the real root should eventually be - that's
          # still a separate call to make.
          # (printf, not a heredoc: a heredoc's closing delimiter has to be
          # completely unindented, which doesn't survive living inside an
          # indented YAML block scalar - learned that the hard way while
          # writing this line, not shipped as a live guess.)
          if [ ! -f _site/index.html ]; then
            printf '%s\n' \
              '<!doctype html><html><head><meta charset="utf-8"><title>GutBacteria</title></head>' \
              '<body style="font:16px/1.5 ui-sans-serif,system-ui;background:#160E2B;color:#F1EAFF;padding:2rem;max-width:40rem;margin:0 auto">' \
              '<h1>GutBacteria</h1>' \
              '<ul>' \
              '<li><a href="./gut-flora-atlas.html" style="color:#8FD3F4">Gut Flora Atlas (current app)</a></li>' \
              '<li><a href="./react-preview/" style="color:#8FD3F4">React port preview (in progress)</a></li>' \
              '</ul>' \
              '</body></html>' \
              > _site/index.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
