name: Build & deploy (React port + existing site, combined)

# Manual trigger only (workflow_dispatch) - this is the workflow currently
# powering the live kelcamer.github.io/GutBacteria Pages deployment (Pages
# source was switched from "Deploy from a branch" to "GitHub Actions" once
# this was confirmed working end-to-end; see "Porting to native
# react/PORTING_PLAN.md" for that history). Re-run it manually (Actions tab
# -> this workflow -> Run) whenever the live site should pick up new
# commits - there's no push trigger, so nothing deploys automatically as a
# side effect of a routine commit.
#
# Single checkout, on purpose: the React port used to live on a separate
# `native-react-app` branch (which needed its own checkout, by explicit
# ref, since it was cleaned to carry only React-relevant files) - that
# branch has since been merged back into `main` now that the port is
# complete and verified, so both apps live in the same tree again and one
# checkout covers both.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "Porting to native react/app/package-lock.json"

      - name: Install React port dependencies
        working-directory: "Porting to native react/app"
        run: npm ci

      - name: Build React port
        working-directory: "Porting to native react/app"
        run: npm run build

      - name: Assemble combined Pages artifact
        run: |
          set -e
          mkdir -p _site
          # Existing site, unchanged - every tracked file at repo root,
          # minus the things that don't belong in a deploy (this workflow,
          # the porting project's own source, git/editor cruft).
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.githooks' \
            --exclude='.venv-readable' \
            --exclude='Porting to native react' \
            --exclude='_site' \
            ./ _site/
          # New React port, at its own subpath, alongside the old app.
          mkdir -p "_site/react-preview"
          cp -r "Porting to native react/app/dist/." "_site/react-preview/"
          # There's no index.html at the repo root - the classic "Deploy
          # from a branch" source used to paper over that with Jekyll
          # auto-rendering README.md into a landing page, but
          # Actions-sourced Pages does NOT run Jekyll, so without this the
          # root would 404. Minimal honest placeholder, not a silent
          # decision about what the real root should eventually be - that's
          # still a separate call to make.
          # (printf, not a heredoc: a heredoc's closing delimiter has to be
          # completely unindented, which doesn't survive living inside an
          # indented YAML block scalar - learned that the hard way while
          # writing this line, not shipped as a live guess.)
          if [ ! -f _site/index.html ]; then
            printf '%s\n' \
              '<!doctype html><html><head><meta charset="utf-8"><title>GutBacteria</title></head>' \
              '<body style="font:16px/1.5 ui-sans-serif,system-ui;background:#160E2B;color:#F1EAFF;padding:2rem;max-width:40rem;margin:0 auto">' \
              '<h1>GutBacteria</h1>' \
              '<ul>' \
              '<li><a href="./gut-flora-atlas.html" style="color:#8FD3F4">Gut Flora Atlas (current app)</a></li>' \
              '<li><a href="./react-preview/" style="color:#8FD3F4">React port preview (in progress)</a></li>' \
              '</ul>' \
              '</body></html>' \
              > _site/index.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
